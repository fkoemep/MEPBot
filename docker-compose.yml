services:
  app:
    container_name: mep-bot
    build:
      no_cache: false
      context: .
      network: host
    ports:
      - "8080:8080"
    environment:
        - GOOGLE_APPLICATION_CREDENTIALS=/app/credentials.json
    env_file:
      - .env
    volumes:
      - ${GOOGLE_APPLICATION_CREDENTIALS_PATH}:/app/credentials.json:ro
