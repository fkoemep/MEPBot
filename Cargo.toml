[package]
name = "mep-bot"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12.22", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
futures-util = "0.3"
tokio-tungstenite = { version = "0.27.0", features = ["rustls-tls-webpki-roots"] }
url = "2"
firestore = "0.46.0"
thiserror = "2.0" # Add this
serde = { version = "1.0", features = ["derive"] } # Add derive feature
dotenv = "0.15"
env_logger = "0.11"
log = "0.4.27"

[profile.release]
strip = true  # Automatically strip symbols from the binary.
lto = true
codegen-units = 1
panic = "abort"
opt-level = "s"