[package]
name = "mep-bot"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
futures-util = "0"
tokio-tungstenite = { version = "0", features = ["rustls-tls-webpki-roots"] }
url = "2"
firestore = "0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
dotenv = "0"
env_logger = "0"
log = "0"

[profile.release]
strip = true  # Automatically strip symbols from the binary.
lto = true
codegen-units = 1
panic = "abort"
opt-level = "s"

[[bin]]
name = "app"
path = "src/main.rs"